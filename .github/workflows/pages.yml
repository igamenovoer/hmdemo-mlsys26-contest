name: Deploy Slides to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "slides/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slides
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bunx slidev build slides.md --base /hmdemo-mlsys26-contest/ --router-mode hash

      - run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'dist/index.html'
          const html = fs.readFileSync(path, 'utf8')
          const script = `<script>(function(){var base='/hmdemo-mlsys26-contest/';var legacy='#'+base;if(location.hash.indexOf(legacy)===0){location.replace(base+'#/'+location.hash.slice(legacy.length)+location.search);return}if(location.pathname.indexOf(base)===0&&location.pathname!==base&&!location.hash){var rest=location.pathname.slice(base.length);if(rest.charAt(rest.length-1)==='/')rest=rest.slice(0,-1);if(rest)location.replace(base+'#/'+rest+location.search)}})();</script>`
          fs.writeFileSync(path, html.replace('</head>', script + '</head>'))
          fs.copyFileSync(path, 'dist/404.html')
          NODE

      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
