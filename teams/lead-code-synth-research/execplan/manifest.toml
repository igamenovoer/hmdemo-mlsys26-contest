current_stage = "clarify-execplan"
generated_source_posture = "execplan is generated operational material; intention and ADR files are editable source authority"
generated_date = "2026-06-04"
generated_with = "houmao-agent-loop-pro clarify-execplan cli-credential-assignment"
scaffold_profile = "execplan-finalize-docs"

[stage_status]
process = "current"
contracts = "current"
harness = "current"
skills = "current"
agent_bindings = "current"
final_docs = "current"

[finalization]
description = "Final generated support docs and metadata for operator review."
support_docs = ["docs/artifact-index.md", "docs/operator-guide.md", "docs/runtime-model.md", "docs/validation.md"]
validate_execplan_next = "$houmao-agent-loop-pro validate-execplan teams/lead-code-synth-research"
platform_side_effects = "none"

[omissions]
description = "Default layers intentionally omitted at the contract stage."
collab_records_dir = "omitted because topology, communication, and state contracts carry route and record authority"
state_records_dir = "omitted because sqlite is the selected generated state authority for durable bookkeeping"
platform_setup = "omitted because maintained Houmao skills own workspace, mailbox, gateway, launch, messaging, and inspection mechanics"
runtime_execution = "omitted because prepare-agents, prepare-workspace, validate-loop, launch-agents, and start are later execution stages"
profile_subdir_readmes = "omitted because profile subdirectories are indexed by agents/bindings.toml plus config.toml, definition.md, and memo-seed.md"
gpu_dataset_checks = "omitted from default execplan validation because official timing and GPU benchmarking are runtime evaluation work"

[agent_runtime_skills]
assignment = "all-managed-agents"
root = "../../../skillset/runtime"
names = ["krnopt-cuda-coding", "krnopt-cuda-domain-optimization", "krnopt-cuda-generic-optimization", "krnopt-cuda-profiling", "krnopt-cuda-structural-optimization", "krnopt-hw-aware-optimization", "krnopt-low-precision-kernel-formats", "project-op-variant-comparison", "project-op-variant-profiling", "project-op-variant-validation"]

[agent_cli_assignment]
description = "Planned CLI launch distribution for the six managed lcsr-* agents."
policy = "use-both-cli-tools"
credential_boundary = "record credential display names and posture only; do not store subscription tokens or API keys in execplan artifacts"
codex_official_agents = ["lcsr-cuda-coder-1", "lcsr-cuda-coder-2", "lcsr-synthesizer", "lcsr-researcher"]
codex_official_credential = "codex-pro"
claude_kimi_agents = ["lcsr-planner", "lcsr-evaluator"]
claude_kimi_credential = "claude-kimi-cred"

