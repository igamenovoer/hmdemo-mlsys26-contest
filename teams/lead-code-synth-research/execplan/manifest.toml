stable_participant_ids = "planner, cuda-coder-1, cuda-coder-2, synthesizer, researcher, and evaluator remain unprefixed in topology, schemas, and state contracts."
concrete_agent_ids = "Concrete Houmao-facing ids, profile dirs, workspace agent names, and notifier prompt files use the lcsr-* prefix."
runtime_skill_assignment = "Every managed lcsr-* agent receives every directory under skillset/runtime/*, including symlinked krnopt-* skill dirs."
workspace_materialization = "prepare-workspace should use standard in-repo Git worktrees under houmao-ws/lead-code-synth-research with one private repo/ worktree and states/ directory per lcsr-* agent."
cli_distribution = "Codex CLI with project credential codex-pro launches CUDA Coder 1, CUDA Coder 2, Synthesizer, and Researcher; Claude CLI with project credential claude-kimi-cred launches Planner and Evaluator."
privileged_profiling = "NCU sudo password, when needed for privileged counters, is read from runtime env NCU_ROOT_PW and never stored in execplan artifacts."
terminal_authority = "The loop has no automatic success condition; human operator stop is the terminal authority."
platform_boundary = "Clarification and finalization do not create profiles, workspaces, mailboxes, gateways, notifiers, memory, or live agents."

