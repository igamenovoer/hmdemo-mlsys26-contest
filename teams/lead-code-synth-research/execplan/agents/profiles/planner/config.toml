[agent]
description = "Planned Houmao profile config for Planner."
agent_id = "planner"
participant_id = "planner"
role_id = "planner"
easy_profile = "planner"

[paths]
definition = "definition.md"
memo_seed = "memo-seed.md"
notifier_prompt = "../../notifier-prompts/planner.md"
workspace_contract = "../../../specs/workspace/workspace.toml"
harness_command = "../../../harness/bin/lead-code-synth-research-harness"

[skills]
install_mode = "project-local-source"
generated = ["lead-code-synth-research-shared-harness", "lead-code-synth-research-on-planning-cycle-start", "lead-code-synth-research-on-synthesis-report", "lead-code-synth-research-on-evaluation-report", "lead-code-synth-research-on-failure-report", "lead-code-synth-research-on-gpu-wait-report", "lead-code-synth-research-planner-tick", "lead-code-synth-research-operator-control"]
system_skill_posture = "preinstalled-by-houmao-managed-agent"

[mail]
mail_driven = true
schema_ids = ["lead-code-synth-research.email.planning-cycle-start", "lead-code-synth-research.email.synthesis-report", "lead-code-synth-research.email.evaluation-report", "lead-code-synth-research.email.failure-report", "lead-code-synth-research.email.gpu-wait-report", "lead-code-synth-research.email.operator-intervention"]
after_mail_tick = "lead-code-synth-research-planner-tick"

[workspace]
policy_ref = "workspace.agents[agent_id=planner]"
workspace_agent_name = "planner"
launch_cwd_policy = "repo-root"
source_mutation_surface = "none"
