[agent]
description = "Planned Houmao profile config for Synthesizer."
agent_id = "synthesizer"
participant_id = "synthesizer"
role_id = "synthesizer"
easy_profile = "synthesizer"

[paths]
definition = "definition.md"
memo_seed = "memo-seed.md"
notifier_prompt = "../../notifier-prompts/synthesizer.md"
workspace_contract = "../../../specs/workspace/workspace.toml"
harness_command = "../../../harness/bin/lead-code-synth-research-harness"

[skills]
install_mode = "project-local-source"
generated = ["lead-code-synth-research-shared-harness", "lead-code-synth-research-on-coder-result", "lead-code-synth-research-on-research-summary", "lead-code-synth-research-synthesizer-tick"]
system_skill_posture = "preinstalled-by-houmao-managed-agent"

[mail]
mail_driven = true
schema_ids = ["lead-code-synth-research.email.coder-result", "lead-code-synth-research.email.research-summary"]
after_mail_tick = "lead-code-synth-research-synthesizer-tick"

[workspace]
policy_ref = "workspace.agents[agent_id=synthesizer]"
workspace_agent_name = "synthesizer"
launch_cwd_policy = "repo-root"
source_mutation_surface = "none"
