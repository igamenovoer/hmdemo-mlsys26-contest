# Generated topology contract.
mode = "generic-loop"
description = "Directed generic-loop for Fused MoE optimization with bounded cycles."
cycle_control = "Cycles are bounded by work_item_id, search_direction_id, attempt count, promotion, blocker, budget, or operator stop."
dedupe_key = "run_id + search_direction_id + work_item_id + attempt_index + payload_id"
repeat_visit_posture = "Allowed when a new attempt_index, research_brief_id, or operator search_correction creates new context."
terminal_result_authority = "operator"
promotion_authority = "synthesizer"

[[participants]]
id = "operator"
kind = "human"
description = "Runtime authority."

[[participants]]
id = "planner"
kind = "agent"
description = "Search direction and scheduling owner."

[[participants]]
id = "coder-1"
kind = "agent"
description = "Coder instance."

[[participants]]
id = "coder-2"
kind = "agent"
description = "Coder instance."

[[participants]]
id = "coder-3"
kind = "agent"
description = "Coder instance."

[[participants]]
id = "synthesizer"
kind = "agent"
description = "Promotion authority."

[[participants]]
id = "profiler"
kind = "agent"
description = "Profiler."

[[participants]]
id = "researcher"
kind = "agent"
description = "Research support."

[[routes]]
message_family = "task_assignment"
from = "planner"
to = "coder-*"
result_target = "synthesizer"
predecessor_context = "selected current_best_ref, search_direction_id, workload_scope_ref, allowed_edit_surface_ref, command refs, and profile refs"

[[routes]]
message_family = "candidate_result"
from = "coder-*"
to = "synthesizer"
result_target = "synthesizer"
predecessor_context = "work_item_id, attempt_index, changed files, evidence refs, and baseline comparator"

[[routes]]
message_family = "synthesis_report"
from = "synthesizer"
to = "planner"
result_target = "planner"
predecessor_context = "candidate_result refs and current_best update"

[[routes]]
message_family = "profile_request"
from = "planner"
to = "profiler"
result_target = "planner"
predecessor_context = "current_best_ref, workload_scope_ref, and requested metrics"

[[routes]]
message_family = "profile_report"
from = "profiler"
to = "planner"
result_target = "planner"
predecessor_context = "profile_request ref and artifact refs"

[[routes]]
message_family = "research_request"
from = "planner"
to = "researcher"
result_target = "planner"
predecessor_context = "search_direction_id, failed_attempt refs, profile refs, and requested reference area"

[[routes]]
message_family = "research_brief"
from = "researcher"
to = "planner"
result_target = "planner"
predecessor_context = "research_request ref and source refs"

[[routes]]
message_family = "operator_escalation"
from = "planner"
to = "operator"
result_target = "operator"
predecessor_context = "search_direction_id, failed attempt summary, research_brief refs, and requested operator decision"

[[routes]]
message_family = "search_correction"
from = "operator"
to = "planner"
result_target = "planner"
predecessor_context = "operator decision and optional constraints"

[[routes]]
message_family = "terminal_report"
from = "planner"
to = "operator"
result_target = "operator"
predecessor_context = "current_best, run summary, budget or blocker reason"
