direction = """Implement true FP8 e4m3fn tensor-core GEMM with block scaling using CUTLASS 3.5 or cuBLASLt, replacing both the float32 dequantization and the float32 GEMM.

The baseline dequantizes FP8 weights and activations to float32, then runs float32 GEMM via Cutlass 2.x BasicGemm. The cycle-1 c1 attempt fell back to BF16 tensor-core GEMM because implementing true FP8 block-scaled GEMM requires correct scale tensor layout handling.

Your task: Implement a true FP8 tensor-core GEMM pipeline:
1. Replace `run_basic_gemm` with CUTLASS 3.5 or cuBLASLt FP8 GEMM calls.
2. The inputs are already FP8 e4m3fn; do NOT dequantize to float32 or BF16 first.
3. Apply the provided block scales correctly:
   - hidden_states_scale: per 128-element block of hidden dim, per token. Shape [hidden_blocks, seq_len].
   - gemm1_weights_scale: per 128x128 block of weight matrix. Shape [expert, gemm1_out_blocks, hidden_blocks].
   - gemm2_weights_scale: per 128x128 block of weight matrix. Shape [expert, hidden_blocks, intermediate_blocks].
4. CUTLASS 3.5 FP8 GEMM supports block scaling via separate scale tensors. Check the CUTLASS 3.5 examples for the exact scale tensor layout contract.
5. If CUTLASS 3.5 proves too complex in one bounded attempt, cuBLASLt's cublasLtMatmul with CUBLAS_COMPUTE_32F_FAST_TF32 and FP8 inputs may be a viable fallback, though it may not support arbitrary block scales.

Key constraints and hints:
- GEMM1: M = expert_token_count, N = 4096, K = 7168
- GEMM2: M = expert_token_count, N = 7168, K = 2048
- Keep the same TVM FFI entry point signature
- Verify numerical correctness carefully; FP8 dynamic range is small
- Run local checks on a dynamically selected spare local GPU
- If no spare GPU is available, report waiting-for-GPU and stop
- If you hit non-GPU blockers, retry up to 3 times, then report failure"""
