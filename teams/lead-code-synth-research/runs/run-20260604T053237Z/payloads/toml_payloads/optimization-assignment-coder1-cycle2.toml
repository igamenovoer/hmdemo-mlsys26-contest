direction = """Replace the sequential per-expert host loop with CUBLAS batched GEMM or CUTLASS grouped GEMM to process all local experts in parallel.

The baseline loops over 32 experts sequentially on the host, launching separate kernels per expert for dequant, GEMM1, SwiGLU, GEMM2, and accumulation. This creates massive kernel launch overhead and forces a host sync barrier (cudaStreamSynchronize) before the loop starts.

Your task: Replace the sequential expert loop with batched/grouped GEMM calls that process all experts in parallel:
1. For GEMM1: all 32 experts' M dimensions vary (token counts per expert). Use CUBLAS batched GEMM with an array of pointers and problem sizes, or CUTLASS grouped GEMM with a problem-size array.
2. For GEMM2: similarly batch all 32 experts.
3. Keep SwiGLU as a single batched kernel or fuse it into the GEMM pipeline if feasible.
4. Eliminate the host cudaStreamSynchronize by pre-allocating maximum-size buffers and using GPU-side data only.

Key constraints and hints:
- GEMM1 dims per expert: M = count[expert], N = 4096, K = 7168
- GEMM2 dims per expert: M = count[expert], N = 7168, K = 2048
- The counts vary; grouped GEMM is preferred over uniform batched GEMM
- Keep the same TVM FFI entry point signature
- Run local checks on a dynamically selected spare local GPU
- If no spare GPU is available, report waiting-for-GPU and stop
- If you hit non-GPU blockers, retry up to 3 times, then report failure"""
