direction = """Replace global atomicAdd in accumulate_weighted_output_kernel with block-level reductions, and vectorize dequant_compact_activations_kernel for coalesced memory access.

The baseline has two major memory-efficiency bottlenecks:

1. accumulate_weighted_output_kernel: Uses atomicAdd on global memory for EVERY output element. When TopK=8 and many tokens are active, the same output position receives up to 8 atomic updates per token. Global atomics are extremely expensive on modern GPUs.

2. dequant_compact_activations_kernel: Reads FP8 bytes one at a time (scalar loads), missing memory bandwidth by not using vectorized loads (e.g., uint4 for 16 bytes at once).

Your task: Make two improvements:
(a) Replace atomicAdd accumulation with a block-level reduction approach. Group compact slots by token ID so that all expert outputs for the same token are reduced within a thread block using shared memory, then write the final result once per token per hidden element without atomics. Alternatively, sort compact_slot_ids by token and use a block-level parallel reduction.

(b) Vectorize the dequant_compact_activations_kernel loads. Use wider vector loads (e.g., load 4 or 8 FP8 values at once, dequantize them with the appropriate scale, and write float4/float2 to the activations buffer). Ensure the loads are coalesced (adjacent threads load adjacent addresses).

Key constraints and hints:
- Keep the same TVM FFI entry point signature
- The token-to-expert mapping is sparse and varies; handle variable counts efficiently
- Run local checks on a dynamically selected spare local GPU
- If no spare GPU is available, report waiting-for-GPU and stop
- If you hit non-GPU blockers, retry up to 3 times, then report failure"""
