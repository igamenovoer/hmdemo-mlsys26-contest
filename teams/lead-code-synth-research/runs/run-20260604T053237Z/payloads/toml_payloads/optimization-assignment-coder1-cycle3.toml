direction = """Conditional BF16 tensor-core GEMM with per-expert token count thresholding.

Cycle 1 c1 achieved 2.62x speedup at seq_len=1 using BF16 tensor-core GEMM, but regressed to 0.41x-0.70x at seq_len>=14. The regression occurs because BF16 GEMM dequantization overhead dominates when expert token counts are large. For small counts, the tensor-core throughput wins; for large counts, the dequantization + setup overhead loses.

Your task: Fix this by making the GEMM path conditional on expert token count:
1. When count[expert] < threshold (e.g., 8, 16, or 32 — tune this): use BF16 tensor-core GEMM (like cycle 1 c1 did).
2. When count[expert] >= threshold: use baseline float32 Cutlass BasicGemm (no dequantization overhead).
3. The dequantization to BF16 should only happen for experts taking the BF16 path.
4. The threshold should be chosen empirically: try a few values and pick the one that gives the best overall speedup across sequence lengths.

Key constraints and hints:
- Keep the same TVM FFI entry point signature
- GEMM1: M = count[expert], N = 4096, K = 7168
- GEMM2: M = count[expert], N = 7168, K = 2048
- The threshold is per-expert, not global — different experts can take different paths in the same call
- Run local checks on a dynamically selected spare local GPU
- If no spare GPU is available, report waiting-for-GPU and stop
- If you hit non-GPU blockers, retry up to 3 times, then report failure"""
