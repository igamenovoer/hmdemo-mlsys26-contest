direction = """Parallelize the routing top-k kernel and fuse the dequant+GEMM+SwiGLU+GEMM2 pipeline.

The baseline has three major inefficiencies in control flow and parallelism:
1. Routing: Only thread 0 per block does the top-k selection; 255 threads are idle during the most latency-sensitive phase.
2. Host barrier: `cudaStreamSynchronize` after copying expert counts to host blocks the GPU before the expert loop even starts.
3. Separate kernels: Dequant, GEMM1, SwiGLU, GEMM2, and accumulation are all separate kernel launches per expert.

Your task: Make two improvements:
(a) Parallelize `route_topk_kernel` so all threads in the block participate in the group-score reduction and top-k selection. Use warp-level or block-level reductions instead of a single thread doing sequential loops.
(b) Reduce launch overhead by fusing adjacent operations where feasible — for example, fuse dequant with the first GEMM, or fuse SwiGLU with the surrounding GEMM boundaries. At minimum, eliminate the host-side `cudaStreamSynchronize` by using GPU-side dynamic scheduling or pre-allocating the maximum buffer size so host does not need counts before launching.

Key constraints and hints:
- Keep the same TVM FFI entry point signature
- Token counts per expert vary; handling variable counts efficiently is part of the challenge
- Run local checks on a dynamically selected spare local GPU
- If no spare GPU is available, report waiting-for-GPU and stop
- If you hit non-GPU blockers, retry up to 3 times, then report failure"""
