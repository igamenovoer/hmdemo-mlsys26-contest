direction = """Replace float32 Cutlass BasicGemm with CUTLASS 3.x FP8 GEMM kernels using block scaling.

The baseline kernel dequantizes FP8 weights and activations to float32, then runs float32 GEMM via Cutlass 2.x BasicGemm. This is the largest compute bottleneck and misses the massive throughput advantage of FP8 tensor cores on Hopper/Ada.

Your task: Replace `run_basic_gemm` and the associated dequantization kernels with CUTLASS 3.x FP8 GEMM calls that operate directly on the FP8 inputs using the provided per-block scales.

Key constraints and hints:
- Inputs are FP8 e4m3fn with per-128-element block scales (float32)
- GEMM1 dimensions: M = expert_token_count, N = 4096 (2 * 2048), K = 7168
- GEMM2 dimensions: M = expert_token_count, N = 7168, K = 2048
- The scale tensors have shape: gemm1_weights_scale[expert, gemm1_out_blocks, hidden_blocks], gemm2_weights_scale[expert, hidden_blocks, intermediate_blocks], hidden_states_scale[hidden_blocks, seq_len]
- Keep the same TVM FFI entry point signature
- Run local checks on a dynamically selected spare local GPU
- If no spare GPU is available, report waiting-for-GPU and stop
- If you hit non-GPU blockers, retry up to 3 times, then report failure"""
